<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego - Los Gigantes del Sistema Solar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #05051a, #10104a, #05051a);
            color: white;
            min-height: 100vh;
        }

        nav {
            background: rgba(5, 5, 25, 0.95);
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
        }

        .volver {
            color: white;
            text-decoration: none;
            background: #29296e;
            padding: 10px 20px;
            border-radius: 20px;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            font-size: 15px;
            font-weight: bold;
        }

        .volver:hover {
            background: #4444a0;
            transform: scale(1.05);
        }

        .contenedor {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .titulo {
            text-align: center;
            margin-bottom: 25px;
        }

        .titulo h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #d5d5ff;
            font-size: 18px;
        }

        .registro-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.4);
            max-width: 500px;
            margin: 0 auto;
        }

        .registro-box h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .input-nombre {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid rgba(143, 156, 255, 0.4);
            background: rgba(0, 0, 0, 0.35);
            color: white;
            font-size: 17px;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .input-nombre:focus {
            border-color: #8f9cff;
            box-shadow: 0 0 10px rgba(108, 99, 255, 0.5);
        }

        .panel-estado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .contador-tiempo {
            color: #8f9cff;
            font-weight: bold;
        }

        .progreso {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .barra {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6c63ff, #8f9cff);
            transition: width 0.4s;
        }

        .pregunta {
            background: rgba(255,255,255,0.08);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.4);
        }

        .numero {
            color: #8f9cff;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .pregunta h2 {
            font-size: 24px;
            margin-bottom: 25px;
        }

        .opciones {
            display: grid;
            gap: 15px;
        }

        .opcion {
            background: rgba(0,0,0,0.25);
            border: 2px solid transparent;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: 0.3s;
        }

        .opcion:hover {
            background: rgba(108,99,255,0.25);
            border-color: #6c63ff;
            transform: translateX(5px);
        }

        .opcion.correcta {
            background: rgba(40,180,90,0.3);
            border-color: #36d278;
        }

        .opcion.incorrecta {
            background: rgba(220,50,50,0.3);
            border-color: #ff5555;
        }

        .opcion:disabled {
            cursor: default;
        }

        .siguiente {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c63ff, #8f9cff);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: 0.3s;
        }

        .siguiente:hover {
            transform: scale(1.02);
        }

        .resultado {
            display: none;
            text-align: center;
            background: rgba(255,255,255,0.08);
            padding: 45px 30px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.4);
        }

        .resultado h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .nombre-final {
            color: #8f9cff;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .puntaje {
            font-size: 55px;
            font-weight: bold;
            color: #8f9cff;
            margin: 15px;
        }

        .tiempo-final {
            font-size: 16px;
            color: #bbb;
            margin-bottom: 20px;
        }

        .mensaje {
            font-size: 20px;
            margin-bottom: 30px;
            color: #d5d5ff;
            line-height: 1.5;
        }

        .boton {
            display: inline-block;
            padding: 13px 25px;
            margin: 5px;
            border-radius: 25px;
            background: #29296e;
            color: white;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .boton:hover {
            background: #4444a0;
            transform: scale(1.05);
        }

        .reiniciar {
            background: linear-gradient(135deg, #6c63ff, #8f9cff);
        }

        @media (max-width: 700px) {
            nav { padding: 12px 15px; }
            .logo { font-size: 16px; }
            .volver { padding: 8px 12px; font-size: 14px; }
            .titulo h1 { font-size: 28px; }
            .pregunta { padding: 25px 20px; }
            .pregunta h2 { font-size: 20px; }
            .panel-estado { flex-direction: column; gap: 8px; }
        }
    </style>
</head>

<body>

    <nav>
        <button onclick="volverAtras()" class="logo">
            🌌 Gigantes del Sistema Solar
        </button>
        <button onclick="volverAtras()" class="volver">
            ← Volver
        </button>
    </nav>

    <div class="contenedor">

        <div class="titulo">
            <h1>🎮 Desafío Espacial</h1>
            <p>¿Cuánto aprendiste sobre los gigantes del Sistema Solar?</p>
        </div>

        <div class="registro-box" id="pantallaRegistro">
            <h2>Ingresá tu nombre para comenzar:</h2>
            <input type="text" id="nombreJugador" class="input-nombre" placeholder="Tu nombre o apodo..." maxlength="25">
            <br>
            <button class="boton reiniciar" style="width: 100%;" onclick="iniciarConNombre()">
                🚀 Comenzar Desafío
            </button>
        </div>

        <div id="seccionJuego" style="display: none;">
            
            <div class="panel-estado">
                <div>🧑‍🚀 Astronauta: <strong id="lblNombre" style="color: #fff;"></strong></div>
                <div class="contador-tiempo">⏱️ Tiempo: <span id="temporizador">00:00</span></div>
            </div>

            <div class="progreso">
                <div class="barra" id="barra"></div>
            </div>

            <div class="pregunta" id="juego">
                <div class="numero" id="numero">Pregunta 1 de 10</div>
                <h2 id="textoPregunta"></h2>
                <div class="opciones" id="opciones"></div>
                <button class="siguiente" id="siguiente">Siguiente →</button>
            </div>

        </div>

        <div class="resultado" id="resultado">
            <h2>🚀 ¡Desafío Finalizado!</h2>
            <div class="nombre-final" id="nombreResultado"></div>
            <div class="puntaje" id="puntaje">0 / 10</div>
            <div class="tiempo-final" id="tiempoResultado"></div>
            <p class="mensaje" id="mensaje"></p>

            <button class="boton reiniciar" onclick="reiniciarJuego()">
                🔄 Jugar nuevamente
            </button>
            <button onclick="volverAtras()" class="boton">
                🏠 Volver a la página
            </button>
        </div>

    </div>

    <script>
        function volverAtras() {
            if (document.referrer && document.referrer !== "") {
                window.location.href = document.referrer;
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "pagina.html";
            }
        }

        const preguntas = [
            {
                pregunta: "¿Cuál es el planeta más grande del Sistema Solar?",
                opciones: ["Saturno", "Júpiter", "Neptuno", "Urano"],
                correcta: 1
            },
            {
                pregunta: "¿Qué tipo de planeta es Júpiter?",
                opciones: ["Planeta rocoso", "Gigante de hielo", "Gigante gaseoso", "Planeta enano"],
                correcta: 2
            },
            {
                pregunta: "¿Cuál es la famosa tormenta de Júpiter que lleva siglos activa?",
                opciones: ["La Gran Mancha Roja", "La Mancha Azul", "El Gran Huracán", "La Tormenta Solar"],
                correcta: 0
            },
            {
                pregunta: "¿Qué planeta es famoso por sus impresionantes y brillantes anillos de hielo?",
                opciones: ["Júpiter", "Urano", "Saturno", "Neptuno"],
                correcta: 2
            },
            {
                pregunta: "¿De qué están formados principalmente los anillos de Saturno?",
                opciones: ["Fuego y gas", "Hielo, polvo y fragmentos de roca", "Solo agua líquida", "Metal sólido"],
                correcta: 1
            },
            {
                pregunta: "¿Cuál es la luna destacada de Saturno con atmósfera y lagos de metano?",
                opciones: ["Tritón", "Europa", "Titán", "Ío"],
                correcta: 2
            },
            {
                pregunta: "¿Qué planeta gira prácticamente de lado debido a su inclinación de 98°?",
                opciones: ["Neptuno", "Saturno", "Júpiter", "Urano"],
                correcta: 3
            },
            {
                pregunta: "¿Qué gas absorbe la luz roja y le da a Urano y Neptuno su color azul?",
                opciones: ["El nitrógeno", "El metano", "El helio", "El oxígeno"],
                correcta: 1
            },
            {
                pregunta: "¿Cuál es el planeta más lejano del Sistema Solar con vientos de más de 2.000 km/h?",
                opciones: ["Urano", "Saturno", "Neptuno", "Júpiter"],
                correcta: 2
            },
            {
                pregunta: "¿Cuál es la gran luna destacada de Neptuno con géiseres de nitrógeno?",
                opciones: ["Titán", "Tritón", "Calisto", "Ganímedes"],
                correcta: 1
            }
        ];

        let nombreUsuario = "";
        let preguntaActual = 0;
        let puntaje = 0;
        let respondida = false;
        let segundosTranscurridos = 0;
        let intervaloTiempo = null;

        const pantallaRegistro = document.getElementById("pantallaRegistro");
        const inputNombre = document.getElementById("nombreJugador");
        const seccionJuego = document.getElementById("seccionJuego");
        const lblNombre = document.getElementById("lblNombre");
        const temporizador = document.getElementById("temporizador");

        const textoPregunta = document.getElementById("textoPregunta");
        const opciones = document.getElementById("opciones");
        const numero = document.getElementById("numero");
        const siguiente = document.getElementById("siguiente");
        const barra = document.getElementById("barra");
        const resultado = document.getElementById("resultado");

        inputNombre.addEventListener("keyup", function(e) {
            if (e.key === "Enter") iniciarConNombre();
        });

        function iniciarConNombre() {
            const nombre = inputNombre.value.trim();
            if (nombre === "") {
                alert("Por favor, ingresá tu nombre antes de comenzar.");
                inputNombre.focus();
                return;
            }
            nombreUsuario = nombre;
            lblNombre.textContent = nombreUsuario;

            pantallaRegistro.style.display = "none";
            seccionJuego.style.display = "block";

            iniciarContador();
            mostrarPregunta();
        }

        function iniciarContador() {
            segundosTranscurridos = 0;
            actualizarReloj();
            intervaloTiempo = setInterval(() => {
                segundosTranscurridos++;
                actualizarReloj();
            }, 1000);
        }

        function actualizarReloj() {
            const mins = Math.floor(segundosTranscurridos / 60);
            const segs = segundosTranscurridos % 60;
            temporizador.textContent = 
                `${mins.toString().padStart(2, '0')}:${segs.toString().padStart(2, '0')}`;
        }

        function mostrarPregunta() {
            respondida = false;
            siguiente.style.display = "none";

            const pregunta = preguntas[preguntaActual];
            numero.textContent = `Pregunta ${preguntaActual + 1} de ${preguntas.length}`;
            textoPregunta.textContent = pregunta.pregunta;
            opciones.innerHTML = "";

            const progreso = (preguntaActual / preguntas.length) * 100;
            barra.style.width = progreso + "%";

            pregunta.opciones.forEach((opcion, indice) => {
                const boton = document.createElement("button");
                boton.classList.add("opcion");
                boton.textContent = `${String.fromCharCode(65 + indice)}) ${opcion}`;
                boton.onclick = () => seleccionarRespuesta(indice, boton);
                opciones.appendChild(boton);
            });
        }

        function seleccionarRespuesta(indice, botonSeleccionado) {
            if (respondida) return;
            respondida = true;

            const pregunta = preguntas[preguntaActual];
            const botones = document.querySelectorAll(".opcion");

            botones.forEach((boton, i) => {
                boton.disabled = true;
                if (i === pregunta.correcta) {
                    boton.classList.add("correcta");
                }
            });

            if (indice === pregunta.correcta) {
                puntaje++;
            } else {
                botonSeleccionado.classList.add("incorrecta");
            }

            siguiente.style.display = "block";
        }

        siguiente.addEventListener("click", () => {
            preguntaActual++;
            if (preguntaActual < preguntas.length) {
                mostrarPregunta();
            } else {
                terminarJuego();
            }
        });

        function terminarJuego() {
            clearInterval(intervaloTiempo);

            seccionJuego.style.display = "none";
            resultado.style.display = "block";
            barra.style.width = "100%";

            document.getElementById("nombreResultado").textContent = `Astronauta: ${nombreUsuario}`;
            document.getElementById("puntaje").textContent = `${puntaje} / ${preguntas.length}`;
            document.getElementById("tiempoResultado").textContent = `⏱️ Tiempo total: ${temporizador.textContent}`;

            const elementoMensaje = document.getElementById("mensaje");

            if (puntaje > 7) {
                elementoMensaje.innerHTML = `🎉 <strong>¡Felicitaciones, ${nombreUsuario}!</strong><br>Superaste el desafío con más de 7 aciertos y demostraste ser un verdadero experto en los gigantes del Sistema Solar.`;
            } else {
                elementoMensaje.innerHTML = `🪐 <strong>¡Ánimo, ${nombreUsuario}!</strong><br>No lograste superar los 7 aciertos. ¡Volvé a intentarlo para mejorar tu puntuación!`;
            }
        }

        function reiniciarJuego() {
            preguntaActual = 0;
            puntaje = 0;
            resultado.style.display = "none";
            seccionJuego.style.display = "block";
            iniciarContador();
            mostrarPregunta();
        }
    </script>

</body>
</html>
